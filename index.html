<!DOCTYPE html>
<html lang="en">
<head>
    <title>Expense Tracker</title>

    <style>
        table, th, td{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Expense Tracker</h1>

    <table>
        <tr>
            <th>Reason</th>
            <th colspan="2">Amount</th>
        </tr>
        <tr>
            <td>Lunch</td>
            <td>15</td>
            <td>99</td>
        </tr>
        <tr>
            <td>Coffee</td>
            <td>9</td>
            <td>50</td>
        </tr>
    </table>
    <p>Total Expenses: $25.49</p>

</body>
</html>
